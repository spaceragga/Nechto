name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  NODE_VERSION: '20'

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Prisma Client typings are required for API typecheck; no DB needed.
      - run: npx prisma generate
        working-directory: apps/api
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:packages

  api-test:
    needs: quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nechto
          POSTGRES_PASSWORD: nechto
          POSTGRES_DB: nechto
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nechto -d nechto"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      PORT: 3001
      DATABASE_URL: postgresql://nechto:nechto@localhost:5432/nechto
      JWT_SECRET: ci-test-jwt-secret-key
      JWT_EXPIRES_IN: 7d
      COOKIE_SECURE: 'false'
      CORS_ORIGIN: http://localhost:3000,http://127.0.0.1:3000
      STORAGE_DRIVER: local
      STORAGE_LOCAL_ROOT: uploads-test
      STORAGE_PUBLIC_BASE_URL: http://localhost:3001/uploads
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
        working-directory: apps/api
      - run: npx prisma migrate deploy
        working-directory: apps/api
      - run: npm run test:api
      - run: npm run test:api:e2e

  web-e2e:
    needs: quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nechto
          POSTGRES_PASSWORD: nechto
          POSTGRES_DB: nechto
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nechto -d nechto"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      PORT: 3001
      DATABASE_URL: postgresql://nechto:nechto@localhost:5432/nechto
      NEXT_PUBLIC_API_URL: http://localhost:3001
      PLAYWRIGHT_BASE_URL: http://localhost:3000
      PLAYWRIGHT_API_URL: http://localhost:3001
      JWT_SECRET: ci-test-jwt-secret-key
      JWT_EXPIRES_IN: 7d
      COOKIE_SECURE: 'false'
      CORS_ORIGIN: http://localhost:3000,http://127.0.0.1:3000
      STORAGE_DRIVER: local
      STORAGE_LOCAL_ROOT: uploads-e2e
      STORAGE_PUBLIC_BASE_URL: http://localhost:3001/uploads
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
        working-directory: apps/api
      - run: npx prisma migrate deploy
        working-directory: apps/api
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
