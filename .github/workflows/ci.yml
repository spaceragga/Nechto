name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nechto
          POSTGRES_PASSWORD: nechto
          POSTGRES_DB: nechto
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nechto -d nechto"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      PORT: 3001
      DATABASE_URL: postgresql://nechto:nechto@localhost:5432/nechto
      NEXT_PUBLIC_API_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
        working-directory: apps/api
      - run: npx prisma migrate deploy
        working-directory: apps/api
      - run: npm run typecheck
      - run: npm run test:api
      - run: npm run test:api:e2e

  web-e2e:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
