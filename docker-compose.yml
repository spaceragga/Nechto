services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nechto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nechto}
      POSTGRES_DB: ${POSTGRES_DB:-nechto}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-nechto} -d ${POSTGRES_DB:-nechto}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-nechto}:${POSTGRES_PASSWORD:-nechto}@db:5432/${POSTGRES_DB:-nechto}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,http://127.0.0.1:3000}
      JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret-key}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_ROOT: ${STORAGE_LOCAL_ROOT:-/workspace/apps/api/uploads}
      STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL:-http://localhost:3001/uploads}
    ports:
      - '${API_PORT:-3001}:3001'
    volumes:
      - ./apps/api/src:/workspace/apps/api/src
      - ./apps/api/prisma:/workspace/apps/api/prisma
      - ./apps/api/tsconfig.json:/workspace/apps/api/tsconfig.json:ro
      - ./apps/api/tsconfig.build.json:/workspace/apps/api/tsconfig.build.json:ro
      - ./packages/api-contract:/workspace/packages/api-contract
      - ./tsconfig.base.json:/workspace/tsconfig.base.json:ro
      - api_uploads:/workspace/apps/api/uploads
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      # RSC server fetch must reach the api service (not host localhost).
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:3001}
      WATCHPACK_POLLING: 'true'
    ports:
      - '${WEB_PORT:-3000}:3000'
    volumes:
      - ./apps/web/app:/workspace/apps/web/app
      - ./apps/web/components:/workspace/apps/web/components
      - ./apps/web/hooks:/workspace/apps/web/hooks
      - ./apps/web/i18n:/workspace/apps/web/i18n
      - ./apps/web/lib:/workspace/apps/web/lib
      - ./apps/web/messages:/workspace/apps/web/messages
      - ./apps/web/public:/workspace/apps/web/public
      - ./apps/web/middleware.ts:/workspace/apps/web/middleware.ts:ro
      - ./apps/web/next.config.ts:/workspace/apps/web/next.config.ts:ro
      - ./apps/web/postcss.config.ts:/workspace/apps/web/postcss.config.ts:ro
      - ./apps/web/tsconfig.json:/workspace/apps/web/tsconfig.json:ro
      - ./apps/web/env.d.ts:/workspace/apps/web/env.d.ts:ro
      - ./apps/web/css.d.ts:/workspace/apps/web/css.d.ts:ro
      - ./packages/api-contract:/workspace/packages/api-contract
      - ./packages/api-client:/workspace/packages/api-client
      - ./tsconfig.base.json:/workspace/tsconfig.base.json:ro
    depends_on:
      - api

volumes:
  postgres_data:
  api_uploads:
